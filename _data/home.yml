publications:
  - title: 'Mixture of Specialized Vision Experts: Unlocking Complementary Visual Insights for Faithful MLLM Reasoning'
    image: /images/mosve.png
    venue: ECCV 2026
    article_url: https://link.springer.com/chapter/10.1007/978-3-032-37023-5_2
    summary:
      en: MoSVE combines complementary visual experts to reduce hallucinations and improve visually grounded reasoning in multimodal large language models.
      zh: MoSVE 融合不同视觉专家的互补信息，减少多模态大语言模型的幻觉，提升基于视觉证据的推理能力。
    authors:
      - Yifei Gao
      - Liangliang You
      - Jiye Xie
      - Changwei Wang
      - Kexue Fu
      - name: Jingyi Liu
        self: true
      - Rongtao Xu
      - Zhiqiang Kou
      - Haoran Xu
      - Longxiang Gao
      - Yu Zhang
  - title: Adaptive Visual Autoregressive Acceleration via Dual-Linkage Entropy Analysis
    image: /images/nova.png
    venue: ICML 2026
    article_url: https://arxiv.org/abs/2602.01345
    paper_url: https://arxiv.org/pdf/2602.01345
    summary:
      en: NOVA accelerates visual autoregressive generation without additional training, using entropy-guided token reduction across scales and layers together with residual caching.
      zh: NOVA 通过跨尺度、跨层的熵引导 token 精简与残差缓存，无需额外训练即可加速视觉自回归生成。
    authors:
      - Yu Zhang
      - name: Jingyi Liu
        self: true
        mark: '†'
      - Feng Liu
      - name: Duoqian Miao
        mark: '*'
      - Qi Zhang
      - Kexue Fu
      - Changwei Wang
      - Longbing Cao
    notes:
      en: '† Project Lead · * Corresponding Author'
      zh: '† 项目负责人 · * 通讯作者'
  - title: 'Markovian Scale Prediction: A New Era of Visual Autoregressive Generation'
    image: /images/markovvar.png
    venue: CVPR 2026
    article_url: https://arxiv.org/abs/2511.23334
    paper_url: https://arxiv.org/pdf/2511.23334
    project_url: https://luokairo.github.io/markov-var-page/
    summary:
      en: Markov-VAR reformulates scale prediction as a Markov process, using a compact history vector to reduce reliance on full context, lowering memory usage while further improving generation quality.
      zh: Markov-VAR 将尺度预测建模为马尔可夫过程，以紧凑的历史向量减少对完整上下文的依赖，在降低显存开销的同时进一步提升生成质量。
    authors:
      - Yu Zhang
      - name: Jingyi Liu
        self: true
        mark: '†'
      - Yiwei Shi
      - Qi Zhang
      - name: Duoqian Miao
        mark: '*'
      - Changwei Wang
      - Longbing Cao
    notes:
      en: '† Project Lead · * Corresponding Author'
      zh: '† 项目负责人 · * 通讯作者'
  - title: Enhancing Quantization for Visual AutoRegressive Generation via Uncertainty Identification
    image: /images/eq.png
    venue: ICASSP 2026
    distinction:
      en: Oral
      zh: 口头报告
    article_url: https://doi.org/10.1109/ICASSP55912.2026.11462147
    # Keep this description at the scope supported by the title and local method figure.
    summary:
      en: This work explores uncertainty-aware quantization for visual autoregressive generation, using entropy to identify uncertain prediction scales.
      zh: 这项工作探索面向视觉自回归生成的不确定性感知量化，利用熵识别预测中具有较高不确定性的尺度。
    authors:
      - name: Jingyi Liu
        self: true
      - Guangyao Xiong
      - name: Shuxia Ren
        mark: '†'
      - Ruoyang Gao
      - Linkun Yu
      - Kexue Fu
    notes:
      en: '† Corresponding Author'
      zh: '† 通讯作者'

